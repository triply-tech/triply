# Testcontainers-managed PostgreSQL so tests run against real Postgres without needing Neon.
# The jdbc:tc: URL boots a throwaway Postgres 16 container; Docker must be available
# (present by default on GitHub Actions ubuntu-latest, and locally via Docker Desktop).
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-minimum-32-characters-long
app.jwt.expiration=86400000
