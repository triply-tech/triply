name: Deploy - Stage

on:
  workflow_run:
    workflows:
      - "CI - Develop Branch"
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    steps:
      - name: Trigger Render stage deploy
        run: curl -X POST ${{ secrets.RENDER_STAGE_DEPLOY_HOOK }}
